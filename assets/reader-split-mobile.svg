<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">人类阅读区与 AI 阅读区的移动端分界</title>
  <desc id="desc">上半部米白区域标注给人类阅读的故事与作品，下半部暖黑区域标注给 AI Agent 阅读的结构化档案。</desc>
  <defs><style>.mono{font-family:'Cascadia Code','JetBrains Mono',Consolas,'Microsoft YaHei',monospace}.sans{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}</style></defs>
  <rect width="600" height="180" fill="#F3EDE3"/>
  <rect y="180" width="600" height="180" fill="#17130F"/>
  <polygon points="0,168 600,188 600,202 0,182" fill="#FF6330"/>
  <g class="mono">
    <text x="40" y="46" font-size="11" letter-spacing="2" fill="#211A14" fill-opacity=".62">01 / HUMAN-READABLE ZONE</text>
    <text x="40" y="103" class="sans" font-size="32" font-weight="700" fill="#211A14">给人类看的内容 ↑</text>
    <text x="40" y="140" class="sans" font-size="14" fill="#64564B">故事 · 作品 · 技术路线 · 可点击入口</text>
  </g>
  <g class="mono">
    <text x="40" y="232" font-size="11" letter-spacing="2" fill="#FF6330">02 / MACHINE-READABLE ZONE</text>
    <text x="40" y="289" class="sans" font-size="31" font-weight="700" fill="#F4EEE5">给 Agent 读的档案 ↓</text>
    <text x="40" y="326" class="sans" font-size="14" fill="#C8BEB1">AI.md · ai/profile.yaml · llms.txt</text>
  </g>
  <path d="M40 156H560" stroke="#211A14" stroke-opacity=".18"/>
  <path d="M40 342H560" stroke="#F4EEE5" stroke-opacity=".18"/>
</svg>
