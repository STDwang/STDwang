    <style>.mono{font-family:'Cascadia Code','JetBrains Mono',Consolas,'Microsoft YaHei',monospace}.sans{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}</style>
  </defs>
  <rect width="600" height="520" fill="#F3EDE3"/><rect width="600" height="520" fill="url(#grid)"/>
  <ellipse cx="300" cy="405" rx="230" ry="130" fill="url(#glow)"/>
  <g fill="none" stroke="#211A14" stroke-opacity=".48" stroke-width="1.4"><path d="M20 48V20h28"/><path d="M580 48V20h-28"/><path d="M20 472v28h28"/><path d="M580 472v28h-28"/></g>
