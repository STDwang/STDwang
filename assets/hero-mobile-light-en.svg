  <text class="mono" x="48" y="145" font-size="76" font-weight="800" letter-spacing="-4" fill="#211A14">PEN<tspan fill="#D74716">PEN</tspan></text>
  <text class="sans" x="52" y="181" font-size="20" font-weight="600" letter-spacing="3" fill="#211A14">Shuaipeng Wang / penpen</text>
