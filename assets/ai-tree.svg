  <circle class="leafA" cx="510" cy="372" r="52"/>
  <circle class="leafA" cx="450" cy="330" r="88"/>
  <circle class="leafB" cx="408" cy="282" r="46"/>
  <circle class="leafB" cx="492" cy="282" r="46"/>
  <circle class="leafC" cx="450" cy="322" r="55"/>

  <!-- 右侧树冠 -->
  <circle class="leafA" cx="640" cy="460" r="55"/>
  <circle class="leafA" cx="768" cy="460" r="55"/>
  <circle class="leafA" cx="705" cy="430" r="80"/>
  <circle class="leafB" cx="670" cy="370" r="50"/>
  <circle class="leafB" cx="745" cy="370" r="50"/>
  <circle class="leafC" cx="705" cy="425" r="52"/>

  <!-- 果实标签：AI 辅助落地的作品 -->
  <path class="stem" d="M138,502 C 134,520 132,535 132,546"/>
  <rect class="tag" x="45" y="546" width="180" height="27" rx="13"/>
  <text class="t-tag" x="135" y="564" text-anchor="middle">🎮 mistloop · 雾林回环</text>

  <path class="stem" d="M262,505 C 266,525 268,545 268,568"/>
  <rect class="tag" x="206" y="568" width="128" height="27" rx="13"/>
