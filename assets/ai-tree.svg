<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1160" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="trunkGrad" x1="0" y1="600" x2="0" y2="958" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e4a28"/>
      <stop offset="1" stop-color="#8a5f36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #0d1117; }
      .ground { fill: #122a1c; }
      .star { fill: #8b949e; opacity: 0.55; }
      .firefly { fill: #f2cc60; opacity: 0.85; }
      .leafA { fill: #1c6b34; }
      .leafB { fill: #2ea043; }
      .leafC { fill: #46d160; }
      .trunkLine { stroke: #4a3116; stroke-width: 2; fill: none; opacity: 0.55; stroke-linecap: round; }
      .branch { stroke: #6e4a28; fill: none; stroke-linecap: round; }
      .root { stroke: #6e4a28; fill: none; stroke-linecap: round; opacity: 0.85; }
      .stem { stroke: #46d160; stroke-width: 1.4; fill: none; opacity: 0.7; }
      .t-title { fill: #e6edf3; font-size: 30px; font-weight: 700; }
      .t-sub { fill: #8b949e; font-size: 14px; }
      .t-chip-title { fill: #79b8ff; font-size: 19px; font-weight: 700; }
      .t-chip-sub { fill: #8b949e; font-size: 12px; }
      .t-tag { fill: #7ee787; font-size: 12px; font-weight: 600; }
      .t-root { fill: #d2a8ff; font-size: 13px; font-weight: 600; }
      .t-legend { fill: #8b949e; font-size: 13px; }
      .chip { fill: rgba(88,166,255,0.10); stroke: rgba(88,166,255,0.45); stroke-width: 1.2; }
      .tag { fill: rgba(70,209,96,0.12); stroke: rgba(70,209,96,0.50); stroke-width: 1.2; }
      .rootchip { fill: rgba(210,168,255,0.10); stroke: rgba(210,168,255,0.45); stroke-width: 1.2; }
      .connector { stroke: rgba(88,166,255,0.35); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .ground { fill: #e2f3e6; }
        .star { fill: #0969da; opacity: 0.25; }
        .firefly { fill: #d4a72c; opacity: 0.6; }
        .leafA { fill: #1a7f37; }
        .leafB { fill: #2da44e; }
        .leafC { fill: #4ac26b; }
        .trunkLine { stroke: #5a3d22; }
        .branch { stroke: #8b5e34; }
        .root { stroke: #8b5e34; }
        .t-title { fill: #1f2328; }
        .t-sub { fill: #57606a; }
        .t-chip-title { fill: #0969da; }
        .t-chip-sub { fill: #57606a; }
        .t-tag { fill: #1a7f37; }
        .t-root { fill: #8250df; }
        .t-legend { fill: #57606a; }
        .chip { fill: rgba(9,105,218,0.07); stroke: rgba(9,105,218,0.40); }
        .tag { fill: rgba(26,127,55,0.08); stroke: rgba(26,127,55,0.45); }
        .rootchip { fill: rgba(130,80,223,0.08); stroke: rgba(130,80,223,0.40); }
        .connector { stroke: rgba(9,105,218,0.30); }
      }
    </style>
