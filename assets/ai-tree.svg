  <path class="branch" stroke-width="14" d="M436,612 C 380,572 320,542 262,508 C 240,496 226,486 214,474"/>
  <path class="branch" stroke-width="14" d="M464,612 C 520,572 580,542 638,508 C 660,496 674,486 686,474"/>
  <path class="branch" stroke-width="12" d="M450,606 C 448,540 446,470 447,408"/>
  <path class="branch" stroke-width="7" d="M300,546 C 320,530 340,520 358,514"/>
  <path class="branch" stroke-width="7" d="M600,546 C 580,530 560,520 542,514"/>

