  <line class="connector" x1="450" y1="188" x2="450" y2="208"/>
  <rect class="chip" x="315" y="126" width="270" height="62" rx="14"/>
  <text class="t-chip-title" x="450" y="152" text-anchor="middle">🤖 WorkBuddy</text>
  <text class="t-chip-sub" x="450" y="174" text-anchor="middle">Agent 编排 · Skill · MCP · 自动化工作流</text>

  <line class="connector" x1="705" y1="308" x2="705" y2="330"/>
  <rect class="chip" x="585" y="250" width="240" height="58" rx="14"/>
