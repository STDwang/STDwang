  <circle class="star" cx="760" cy="150" r="1.5"/><circle class="star" cx="830" cy="260" r="1"/>
  <circle class="star" cx="700" cy="90" r="1"/><circle class="star" cx="120" cy="320" r="1"/>
  <circle class="star" cx="820" cy="380" r="1.2"/><circle class="star" cx="60" cy="470" r="1"/>
  <circle class="star" cx="240" cy="120" r="1"/><circle class="star" cx="660" cy="220" r="1"/>
  <circle class="firefly" cx="320" cy="480" r="2.2"/><circle class="firefly" cx="580" cy="470" r="2"/>
