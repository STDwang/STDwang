    audience: "humans"
    language: "zh-CN"
    default: true
    role: "visual_and_narrative_profile"
    parse_as_structured_fact_source: false
    human_zone_markers: ["HUMAN-READABLE-PROFILE:START", "HUMAN-READABLE-PROFILE:END"]
    ai_zone_markers: ["AI-READER-ZONE:START", "AI-READER-ZONE:END"]
  README_en_md:
    audience: "humans"
    language: "en"
    default: false
    role: "visual_and_narrative_profile"
    parse_as_structured_fact_source: false
    human_zone_markers: ["HUMAN-READABLE-PROFILE-EN:START", "HUMAN-READABLE-PROFILE-EN:END"]
    ai_zone_markers: ["AI-READER-ZONE-EN:START", "AI-READER-ZONE-EN:END"]
  AI_md:
    audience: "ai_agents"
    language: "zh-CN"
    role: "plain_text_instructions"
    parse_as_structured_fact_source: false
  AI_en_md:
    audience: "ai_agents"
    language: "en"
    role: "plain_text_instructions"
    parse_as_structured_fact_source: false
  ai_profile_yaml:
    audience: "ai_agents"
    role: "canonical_structured_data"
    parse_as_structured_fact_source: true
  llms_txt:
